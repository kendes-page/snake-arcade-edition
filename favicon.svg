<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#04040f"/>
  <!-- Snake body segments (S-shape, pixel art) -->
  <!-- Row 1: head going right, top -->
  <rect x="18" y="3" width="7" height="7" rx="1" fill="#00ff9f"/>
  <rect x="10" y="3" width="7" height="7" rx="1" fill="#00ff9f"/>
  <rect x="3"  y="3" width="7" height="7" rx="1" fill="#00ff9f"/>
  <!-- Turn down left -->
  <rect x="3"  y="11" width="7" height="7" rx="1" fill="#00ff9f"/>
  <!-- Row 2: going right -->
  <rect x="3"  y="19" width="7" height="7" rx="1" fill="#00ff9f"/>
  <rect x="10" y="19" width="7" height="7" rx="1" fill="#00ff9f"/>
  <rect x="18" y="19" width="7" height="7" rx="1" fill="#00ff9f"/>
  <!-- Turn down right -->
  <rect x="25" y="19" width="4" height="7" rx="1" fill="#00ff9f"/>
  <!-- Tail -->
  <rect x="25" y="27" width="4" height="3" rx="1" fill="#00ff9f" opacity="0.6"/>
  <!-- Head highlight -->
  <rect x="18" y="3" width="7" height="7" rx="1" fill="#00ffa8" opacity="0.5"/>
  <!-- Eyes (cyan) -->
  <circle cx="23" cy="6"  r="1.2" fill="#00d4ff"/>
  <circle cx="23" cy="9"  r="1.2" fill="#00d4ff"/>
  <!-- Tongue -->
  <line x1="25" y1="6.5" x2="29" y2="4.5" stroke="#ff006e" stroke-width="1" stroke-linecap="round"/>
  <line x1="25" y1="6.5" x2="29" y2="8.5" stroke="#ff006e" stroke-width="1" stroke-linecap="round"/>
</svg>